name: 毎朝のニュース更新

on:
  schedule:
    - cron: '45 21 * * *'   # 毎日 6:45（日本時間）
  workflow_dispatch:         # Actions 画面から手動でも実行できる
  push:
    branches: [main]
    paths:
      - 'scripts/update_news.py'
      - '.github/workflows/news.yml'

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ニュースを集める
        run: python3 scripts/update_news.py
      - name: 変更があればコミット
        run: |
          if git diff --quiet -- news.json; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "ニュース更新 $(TZ=Asia/Tokyo date +%F)"
          git push
